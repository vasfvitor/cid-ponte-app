name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
        env:
          # Token proxy (worker/README.md); without it the "Detalhar aqui" panel is left out.
          VITE_DETAIL_TOKEN_URL: ${{ vars.VITE_DETAIL_TOKEN_URL }}
      - name: dist contains only the expected files (no WHO data)
        run: |
          if find dist -type f | sort | grep -vE '^dist/(index\.html|assets/[A-Za-z0-9_-]+\.(js|css|woff2)|data/(cid10_v2019\.csv|FONTES\.md))$'; then
            echo "unexpected files in dist/"; exit 1
          fi
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
